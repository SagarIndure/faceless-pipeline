name: Autonomous Faceless Reel Pipeline

on:
  schedule:
    - cron: '30 20 * * *'  # Runs automatically at 2:00 AM IST every night
  workflow_dispatch:       # Gives you a manual "Run workflow" button on GitHub

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg & Fonts (English + Devanagari)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-extra fonts-dejavu-core
          pip install -r requirements.txt

      - name: Render Video & Post to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STORE_URL: ${{ secrets.STORE_URL }}
        run: python generate_reel.py

      - name: Upload MP4 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rendered-reels
          path: output/*.mp4
          retention-days: 30

      - name: Save Updated Queue State
        run: |
          git config user.name "Autonomous-Pipeline-Bot"
          git config user.email "bot@users.noreply.github.com"
          git add content_queue.json
          git diff --staged --quiet || git commit -m "chore: mark rendered reel complete"
          git push
